name: Build Windows installer

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      WINDOWS_SIGNING_CERT_BASE64:
        required: false
      WINDOWS_SIGNING_CERT_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: Version embedded in the installer
        required: true
        default: 0.0.0-dev

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
      SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            packaging/requirements.txt
      - uses: pnpm/setup@v2
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Resolve version
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+([.-][A-Za-z0-9.-]+)?$') { throw "Invalid version: $version" }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $parts = $version.Split('-', 2)[0].Split('.')
          "RELEASE_VERSION_NUMERIC=$($parts[0]).$($parts[1]).$($parts[2]).0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: python packaging/stamp_version.py "${{ inputs.version }}"
      - run: python -m pip install -r backend/requirements.txt -r packaging/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Bundle verified llama.cpp CPU fallback
        run: python packaging/fetch_llama_runtime.py --system windows --architecture x64 --backend cpu --output packaging/runtime
      - name: Compile self-contained application
        run: pyinstaller --noconfirm --clean packaging/portable-local-ai.spec
      - name: Smoke-test compiled application
        shell: pwsh
        run: |
          $env:LOCAL_AI_DATA_DIR = Join-Path $env:RUNNER_TEMP 'portable-local-ai-data'
          $env:LOCAL_AI_MODELS_DIR = Join-Path $env:RUNNER_TEMP 'portable-local-ai-models'
          & .\dist\portable-local-ai\portable-local-ai.exe --initialize
          if ($LASTEXITCODE -ne 0) {
            $errorLog = Join-Path $env:LOCAL_AI_DATA_DIR 'runtime\logs\launcher-error.log'
            if (Test-Path $errorLog) { Get-Content $errorLog }
            throw 'Compiled application initialization failed'
          }
          if (-not (Test-Path (Join-Path $env:LOCAL_AI_DATA_DIR 'local-ai.db'))) { throw 'SQLite initialization failed' }
      - name: Sign application executable
        if: env.SIGNING_CERT_BASE64 != ''
        shell: pwsh
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP 'portable-local-ai-signing.pfx'
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:SIGNING_CERT_BASE64))
          try {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signtool) { throw 'signtool.exe was not found' }
            & $signtool.FullName sign /fd SHA256 /td SHA256 /tr https://timestamp.digicert.com /f $certificate /p $env:SIGNING_CERT_PASSWORD .\dist\portable-local-ai\portable-local-ai.exe
            if ($LASTEXITCODE -ne 0) { throw 'Application signing failed' }
          } finally { Remove-Item $certificate -Force -ErrorAction SilentlyContinue }
      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Compile guided Windows installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc "/DAppVersion=$env:RELEASE_VERSION" "/DAppVersionNumeric=$env:RELEASE_VERSION_NUMERIC" "/DBundleDir=$pwd\dist\portable-local-ai" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }
      - name: Sign and verify Windows installer
        if: env.SIGNING_CERT_BASE64 != ''
        shell: pwsh
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP 'portable-local-ai-signing.pfx'
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:SIGNING_CERT_BASE64))
          try {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
            $installer = Get-ChildItem release\Portable-Local-AI-Windows-Setup-*.exe | Select-Object -First 1
            & $signtool.FullName sign /fd SHA256 /td SHA256 /tr https://timestamp.digicert.com /f $certificate /p $env:SIGNING_CERT_PASSWORD $installer.FullName
            if ($LASTEXITCODE -ne 0) { throw 'Installer signing failed' }
            if ((Get-AuthenticodeSignature $installer.FullName).Status -ne 'Valid') { throw 'Installer signature validation failed' }
          } finally { Remove-Item $certificate -Force -ErrorAction SilentlyContinue }
      - name: Create checksum
        shell: pwsh
        run: |
          $file = Get-ChildItem release\Portable-Local-AI-Windows-Setup-*.exe | Select-Object -First 1
          $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
          "$hash  $($file.Name)" | Set-Content -Encoding ascii "$($file.FullName).sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/Portable-Local-AI-Windows-Setup-*.exe
            release/Portable-Local-AI-Windows-Setup-*.exe.sha256
          if-no-files-found: error
          retention-days: 14
