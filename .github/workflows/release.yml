name: Publish installers

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  windows:
    uses: ./.github/workflows/build-windows.yml
    secrets: inherit
    with:
      version: ${{ github.ref_name }}

  wsl:
    uses: ./.github/workflows/build-wsl.yml
    with:
      version: ${{ github.ref_name }}

  release:
    needs: [windows, wsl]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-installer'
          path: release-assets
          merge-multiple: true
      - name: Verify and combine checksums
        working-directory: release-assets
        run: |
          sha256sum --check *.sha256
          sha256sum Local-AI-Windows-Setup-*.exe Local-AI-WSL-Setup-*.run > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/Local-AI-Windows-Setup-*.exe release-assets/Local-AI-WSL-Setup-*.run release-assets/SHA256SUMS.txt --verify-tag --generate-notes --title "Local AI ${GITHUB_REF_NAME#v}"
