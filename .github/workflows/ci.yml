name: Verify source

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  backend-and-ui:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: pnpm/setup@v2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: python -m pytest -q
        env:
          PYTHONPATH: .

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: pnpm/setup@v2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
