name: Build WSL installer

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Version embedded in the installer
        required: true
        default: 0.0.0-dev

permissions:
  contents: read

jobs:
  build-wsl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            packaging/requirements.txt
      - uses: pnpm/setup@v2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Resolve version
        shell: bash
        run: |
          version='${{ inputs.version }}'
          version=${version#v}
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || { echo "Invalid version: $version" >&2; exit 2; }
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - run: python packaging/stamp_version.py "${{ inputs.version }}"
      - run: python -m pip install -r backend/requirements.txt -r packaging/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Bundle verified llama.cpp CPU fallback
        run: python packaging/fetch_llama_runtime.py --system linux --architecture x64 --backend cpu --output packaging/runtime
      - name: Compile self-contained application
        run: pyinstaller --noconfirm --clean packaging/local-ai.spec
      - name: Smoke-test compiled application
        run: |
          export LOCAL_AI_DATA_DIR="$RUNNER_TEMP/local-ai-data"
          export LOCAL_AI_MODELS_DIR="$RUNNER_TEMP/local-ai-models"
          dist/local-ai/local-ai --initialize
          test -s "$LOCAL_AI_DATA_DIR/local-ai.db"
          test -x dist/local-ai/_internal/runtime/llama-server
      - name: Build and exercise the full WSL system installer
        run: |
          python packaging/build_wsl_installer.py --bundle dist/local-ai --version "$RELEASE_VERSION" --output "release/Local-AI-WSL-Setup-$RELEASE_VERSION.run"
          test_root="$RUNNER_TEMP/wsl-system-root"
          mkdir -p "$test_root"
          LOCAL_AI_INSTALLER_TEST_MODE=1 LOCAL_AI_INSTALLER_TEST_ROOT="$test_root" "release/Local-AI-WSL-Setup-$RELEASE_VERSION.run"
          test -x "$test_root/opt/local-ai/current/local-ai"
          test -L "$test_root/usr/local/bin/local-ai"
          test -s "$test_root/var/lib/local-ai/local-ai.db"
          test -s "$test_root/etc/systemd/system/local-ai.service"
          LOCAL_AI_INSTALLER_TEST_MODE=1 LOCAL_AI_INSTALLER_TEST_ROOT="$test_root" "release/Local-AI-WSL-Setup-$RELEASE_VERSION.run" --uninstall
          test ! -e "$test_root/opt/local-ai"
          test -d "$test_root/var/lib/local-ai"
      - uses: actions/upload-artifact@v7
        with:
          name: wsl-installer
          path: |
            release/Local-AI-WSL-Setup-*.run
            release/Local-AI-WSL-Setup-*.run.sha256
          if-no-files-found: error
          retention-days: 14
